name: L4S host regression and aislop review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run L4S host regression suite
        run: python3 -m unittest discover -s tools/l4s -p 'test_*.py'

  aislop-review:
    runs-on: ubuntu-latest
    continue-on-error: true # C firmware may be outside scanner language coverage
    steps:
      - uses: actions/checkout@v4
      - uses: scanaislop/aislop@v1
        with:
          version: latest
