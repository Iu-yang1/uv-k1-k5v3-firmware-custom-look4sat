name: L4S host regression and aislop review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build L4S native host simulation
        run: |
          mkdir -p build/host
          gcc -std=c11 -Wall -Wextra -Werror -fPIC -shared -O2 \
            -I App/app -I App \
            App/app/l4s_protocol.c App/app/l4s_rssi.c App/app/l4s_io.c \
            App/app/l4s_settings.c App/app/l4s_store.c App/app/l4s_macros.c \
            tools/l4s/macros_host.c tools/l4s/store_host.c tools/l4s/io_host.c \
            App/ui/l4s.c App/font.c App/external/printf/printf.c \
            tools/l4s/display_host.c tools/l4s/host.c \
            -o build/host/l4s_host.dll
      - name: Run CW mode and receive-audio regressions
        run: |
          cd tools/l4s
          python3 -m unittest -v test_protocol test_receive_audio test_dual_watch_tx

  aislop-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Review only PR changes with aislop
        run: |
          # The scanner exits 1 for findings; preserve its JSON and inspect separately.
          npx --yes aislop@latest scan --changes --base origin/main --json > aislop-report.json || true
          test -s aislop-report.json
      - name: Summarize aislop findings
        run: |
          python3 - <<'PY'
          import json
          with open('aislop-report.json', encoding='utf-8') as f:
              report = json.load(f)
          print('score:', report.get('score'), 'scoreable:', report.get('scoreable'))
          print('summary:', report.get('summary'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aislop-pr-review
          path: aislop-report.json
