name: Build Firmware and Modules

on:
  push:
    branches: [ main, 'fix/uvk1-usb-reenumeration-*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Build firmware and overlays
      run: |
        chmod +x compile-firmware.sh compile-app.sh
        for preset in Fusion Transfer FieldOps Labs L4S; do
          ./compile-firmware.sh "$preset"
        done
        ./compile-app.sh All

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-artifact
        path: |
          build/*/*.bin
          build/Apps/*.app
